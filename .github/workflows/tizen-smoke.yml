name: PluginLampa Tizen smoke test
on:
  push:
    paths:
      - 'PluginLampa-tizen.js'
      - 'tests/tizen-smoke.test.cjs'
      - 'tests/stremio-regression.test.cjs'
      - '.github/workflows/tizen-smoke.yml'
  workflow_dispatch:
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node --check PluginLampa-tizen.js
      - run: node tests/tizen-smoke.test.cjs
      - run: node tests/stremio-regression.test.cjs
